<div class="w-full h-screen flex flex-col justify-center items-center bg-gradient-to-b from-blue-100 to-blue-50 p-6">
    <!-- Texto principal -->
    <label 
      class="text-2xl sm:text-3xl md:text-4xl font-bold text-[#023047] mb-6 text-center animate-fade-in-up"
    >
      ¡Ops! <br> Parece que la página que buscas no existe.
    </label>
  
    <!-- Imagen del error -->
    <img 
      src="img/404.png" 
      alt="Página no encontrada" 
      class="w-3/4 max-w-sm sm:max-w-md lg:max-w-lg animate-bounce-slow mb-8"
    >
  
    <!-- Botón para regresar -->
    <button 
    (click)="goToHome()" 
    class="px-6 py-3 bg-[#03071e] text-white font-semibold rounded-lg shadow-lg hover:bg-blue-600 transition-transform transform hover:scale-105"
  >
    Volver al inicio
  </button>
  
  </div>
