<div class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md mx-8">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">{{ title | titlecase }}</h2>
      <form [formGroup]="urlForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Campo URL -->
        <div>
          <label for="url" class="block text-sm font-medium text-gray-700">URL</label>
          <input 
            id="url" 
            type="url" 
            class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
            formControlName="url"
            placeholder="https://dropi.co/"
          />
          <p *ngIf="urlForm.get('url')?.invalid && urlForm.get('url')?.touched" class="text-red-500 text-sm">
            Por favor, ingrese una URL válida.
          </p>
        </div>
  
        <!-- Botones -->
        <div class="flex justify-end space-x-2">
          <button 
            type="button" 
            class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600"
            (click)="closeModal()">
            Cancelar
          </button>
          <button 
            type="submit" 
            class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600"
            [disabled]="urlForm.invalid">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
