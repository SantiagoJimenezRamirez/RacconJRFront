<div class="fixed inset-0 bg-black bg-opacity-50 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md mx-8">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Agregar Producto</h2>
        <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4">
            <!-- Nombre -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Nombre</label>
                <input id="name" type="text"
                    class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    formControlName="name" />
                <p *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched"
                    class="text-red-500 text-sm">El nombre es requerido.</p>
            </div>

            <!-- Precio -->
            <div>
                <label for="price" class="block text-sm font-medium text-gray-700">Precio</label>
                <input id="price" type="number"
                    class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    formControlName="price" />
                <p *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched"
                    class="text-red-500 text-sm">El precio debe ser un número positivo.</p>
            </div>

            <!-- Stock -->
            <div>
                <label for="stock" class="block text-sm font-medium text-gray-700">Stock</label>
                <input id="stock" type="number"
                    class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    formControlName="stock" />
                <p *ngIf="productForm.get('stock')?.invalid && productForm.get('stock')?.touched"
                    class="text-red-500 text-sm">El stock debe ser un número positivo.</p>
            </div>

            <!-- Descripción -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Descripción</label>
                <textarea id="description" rows="3"
                    class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    formControlName="description"></textarea>
                <p *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched"
                    class="text-red-500 text-sm">La descripción es requerida.</p>
            </div>

            <!-- Imagen -->
            <div>
                <label for="imagePath" class="block text-sm font-medium text-gray-700">Imagen</label>
                <input id="imagePath" type="file" accept="image/*" class="mt-1 block w-full"
                    (change)="onFileSelected($event)" />
            </div>

            <!-- Botones -->
            <div class="flex justify-end space-x-2">
                <button type="button" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600"
                    (click)="closeModal()">
                    Cancelar
                </button>
                <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600"
                    [disabled]="productForm.invalid">
                    Guardar
                </button>
            </div>

        </form>
    </div>  
</div>
